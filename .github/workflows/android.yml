name: Android CI

# 提前切换 GitHub Actions JavaScript actions 到 Node.js 24，避免 Node.js 20 弃用警告
# 参考：GitHub Actions Node.js 20 deprecation notice
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Check compile and test
      run: ./gradlew compileDebugSources lint
